services:
  freetoken:
    build:
      context: .
      dockerfile: Dockerfile
    image: freetoken:latest
    container_name: freetoken-server
    restart: unless-stopped
    ports:
      - "1919:1919"
    ipc: host
    environment:
      - HF_HOME=/mnt/storage/huggingface
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - /mnt/storage/huggingface:/mnt/storage/huggingface
      - /mnt/storage/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1919/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    image: freetoken-dsh:latest
    container_name: dsh-web
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./:/workspace/project
    depends_on:
      freetoken:
        condition: service_healthy
