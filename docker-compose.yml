services:
  freetoken:
    image: ghcr.io/abdennebi/freetoken:v0.1.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freetoken-server
    restart: unless-stopped
    ports:
      - "1919:1919"
    ipc: host
    environment:
      - HF_HOME=/mnt/storage/huggingface
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - /mnt/storage/huggingface:/mnt/storage/huggingface
      - /mnt/storage/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "--model"
      - "ornith-ai/Ornith-1.5-35B-A3B-NVFP4"
      - "--moe-backend"
      - "auto"
      - "--moe-cache-size"
      - "800"
      - "--num-tokens"
      - "65536"
      - "--max-prefill-length"
      - "1024"
      - "--memory-ratio"
      - "0.92"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "1919"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1919/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dsh:
    image: ghcr.io/abdennebi/freetoken-dsh:0.1.1-rc.2
    build:
      context: .
      dockerfile: Dockerfile.dsh
    container_name: dsh-web
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./:/workspace/project
    depends_on:
      freetoken:
        condition: service_healthy
