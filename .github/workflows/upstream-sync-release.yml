name: Check Upstream FreeToken & DSH Releases & Trigger Build

on:
  schedule:
    # Exécution automatique toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Forcer le déclenchement du build Docker même si aucun nouveau tag'
        type: boolean
        default: false

jobs:
  check-upstream-freetoken:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Latest Upstream FreeToken Release
        id: upstream
        run: |
          UPSTREAM_REPO="FlashML-org/FreeToken"
          echo "Vérification des releases de $UPSTREAM_REPO..."
          
          LATEST_RELEASE=$(curl -fsSL https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest 2>/dev/null || true)
          UPSTREAM_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')
          
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" == "null" ]; then
            UPSTREAM_TAG=$(curl -fsSL https://api.github.com/repos/${UPSTREAM_REPO}/tags | jq -r '.[0].name // "v0.1.2"')
          fi
          
          echo "Dernier tag FreeToken : $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Check if Tag Already Processed
        id: check_tag
        run: |
          UPSTREAM_TAG="${{ steps.upstream.outputs.upstream_tag }}"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          
          # Check if the tag is already pinned in docker-compose.yml
          if grep -q "freetoken:${UPSTREAM_TAG}" docker-compose.yml && [ "$FORCE_BUILD" != "true" ]; then
            echo "Tag $UPSTREAM_TAG déjà présent et épinglé dans docker-compose.yml. Aucun build nécessaire."
            echo "need_build=false" >> $GITHUB_OUTPUT
          else
            echo "Nouveau tag FreeToken détecté ($UPSTREAM_TAG) !"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag & Trigger FreeToken Build
        if: steps.check_tag.outputs.need_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.upstream.outputs.upstream_tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            } catch (e) {
              console.log('Tag existait déjà ou erreur creation ref:', e.message);
            }
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-publish-ghcr.yml',
              ref: context.ref,
              inputs: {
                freetoken_ref: tag,
                push: true
              }
            });

  check-upstream-dsh:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Latest DSH npm Release
        id: dsh
        run: |
          echo "Vérification des versions npm de @deepseek-ai/dsh..."
          LATEST_DSH=$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh | jq -r '."dist-tags".latest // empty')
          echo "Dernière version DSH disponible : $LATEST_DSH"
          echo "dsh_version=$LATEST_DSH" >> $GITHUB_OUTPUT

      - name: Check if DSH Tag Already Processed
        id: check_dsh_tag
        run: |
          DSH_VERSION="${{ steps.dsh.outputs.dsh_version }}"
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          
          # Check if the DSH version is already pinned in docker-compose.yml
          if grep -q "freetoken-dsh:${DSH_VERSION}" docker-compose.yml && [ "$FORCE_BUILD" != "true" ]; then
            echo "Version DSH $DSH_VERSION déjà présente et épinglée dans docker-compose.yml. Pas de nouveau build."
            echo "need_build=false" >> $GITHUB_OUTPUT
          else
            echo "Nouvelle version DSH détectée ($DSH_VERSION) !"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag & Trigger DSH Build
        if: steps.check_dsh_tag.outputs.need_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.dsh.outputs.dsh_version }}';
            const tag = `dsh-v${version}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            } catch (e) {
              console.log('Tag DSH existait déjà:', e.message);
            }
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-publish-ghcr.yml',
              ref: context.ref,
              inputs: {
                dsh_version: version,
                push: true
              }
            });
