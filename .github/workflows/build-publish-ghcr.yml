name: Build and Publish Multi-Arch Docker Images (AMD64 & ARM64) to GHCR

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'dsh-v*'
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dsh'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Makefile'
      - 'configs/**'
      - '.github/workflows/build-publish-ghcr.yml'
  workflow_dispatch:
    inputs:
      freetoken_ref:
        description: 'FreeToken Git tag/ref (e.g. main, v0.1.2)'
        required: false
        default: 'main'
      dsh_version:
        description: 'DSH npm version (e.g. latest, 0.1.1-rc.2)'
        required: false
        default: 'latest'
      platforms:
        description: 'Target architectures (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Push images to GHCR'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build-freetoken:
    name: Build FreeToken GPU (AMD64 & ARM64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Upstream FreeToken Git Ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.freetoken_ref }}" ]; then
            REF="${{ github.event.inputs.freetoken_ref }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            REF="${{ github.ref_name }}"
          else
            REF="main"
          fi
          echo "Building FreeToken from ref: $REF"
          echo "freetoken_ref=$REF" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for FreeToken
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/freetoken
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=raw,value=${{ steps.ref.outputs.freetoken_ref }},enable=${{ steps.ref.outputs.freetoken_ref != 'main' }}

      - name: Build and Push Multi-Arch FreeToken GPU Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            FREETOKEN_REF=${{ steps.ref.outputs.freetoken_ref }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dsh:
    name: Build DeepSeek Harness Web (AMD64 & ARM64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine DSH Version
        id: dsh_meta
        run: |
          if [ -n "${{ github.event.inputs.dsh_version }}" ]; then
            VERSION="${{ github.event.inputs.dsh_version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/dsh-v ]]; then
            VERSION="${GITHUB_REF_NAME#dsh-v}"
          else
            VERSION=$(curl -s https://registry.npmjs.org/@deepseek-ai/dsh | jq -r '."dist-tags".latest // "latest"')
          fi
          echo "DSH Version to build: $VERSION"
          echo "dsh_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for DSH
        id: meta-dsh
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/freetoken-dsh
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=raw,value=v${{ steps.dsh_meta.outputs.dsh_version }}
            type=raw,value=${{ steps.dsh_meta.outputs.dsh_version }}

      - name: Build and Push Multi-Arch DSH Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dsh
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            DSH_VERSION=${{ steps.dsh_meta.outputs.dsh_version }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta-dsh.outputs.tags }}
          labels: ${{ steps.meta-dsh.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
