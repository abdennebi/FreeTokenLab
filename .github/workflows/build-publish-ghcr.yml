name: Build and Publish Docker Image to GHCR

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/build-publish-ghcr.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag & Upstream ref (e.g. latest, v0.1.2, main)'
        required: false
        default: 'main'
      push:
        description: 'Push image to GHCR'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/freetoken

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on GitHub Runner
        run: |
          echo "Optimizing runner disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

      - name: Determine Upstream Git Ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            REF="${{ github.ref_name }}"
          else
            REF="main"
          fi
          echo "Building FreeToken from ref: $REF"
          echo "freetoken_ref=$REF" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            FREETOKEN_REF=${{ steps.ref.outputs.freetoken_ref }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Summary
        run: |
          echo "### 🐳 Image Docker publiée avec succès sur GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Registre** : \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image** : \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Amont** : \`${{ steps.ref.outputs.freetoken_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags** :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
