name: Build and Publish Docker Images to GHCR

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'Dockerfile.dsh'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'Makefile'
      - 'configs/**'
      - '.github/workflows/build-publish-ghcr.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag & Upstream ref (e.g. latest, v0.1.2, main)'
        required: false
        default: 'main'
      push:
        description: 'Push images to GHCR'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build-freetoken:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for FreeToken
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/freetoken
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

      - name: Determine Upstream Git Ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            REF="${{ github.ref_name }}"
          else
            REF="main"
          fi
          echo "freetoken_ref=$REF" >> $GITHUB_OUTPUT

      - name: Build and Push FreeToken GPU Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            FREETOKEN_REF=${{ steps.ref.outputs.freetoken_ref }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dsh:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for DSH
        id: meta-dsh
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/freetoken-dsh
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

      - name: Build and Push DSH Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dsh
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta-dsh.outputs.tags }}
          labels: ${{ steps.meta-dsh.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
